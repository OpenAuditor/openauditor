# .github/workflows/dependency-check.yml
# Weekly dependency audit — catches CVEs disclosed between PRs
# This runs on a schedule so even repos with infrequent commits stay monitored

name: Weekly Dependency Check

on:
  schedule:
    - cron: '0 8 * * 1'  # Every Monday at 8am UTC
  workflow_dispatch:       # Allow manual trigger from GitHub UI

permissions:
  contents: read
  issues: write            # To create issues for critical findings

jobs:
  # ============================================================
  # Detect which ecosystems this repo uses
  # (hashFiles() is not allowed in a job-level `if`)
  # ============================================================
  detect:
    name: Detect ecosystems
    runs-on: ubuntu-latest
    outputs:
      node: ${{ steps.check.outputs.node }}
      python: ${{ steps.check.outputs.python }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - id: check
        run: |
          [ -f package.json ] && echo "node=true" >> "$GITHUB_OUTPUT" || echo "node=false" >> "$GITHUB_OUTPUT"
          [ -f requirements.txt ] && echo "python=true" >> "$GITHUB_OUTPUT" || echo "python=false" >> "$GITHUB_OUTPUT"

  # ============================================================
  # npm / Node.js dependency audit
  # ============================================================
  npm-audit:
    name: npm Audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.node == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: '24'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci --ignore-scripts

      - name: Run npm audit
        id: audit
        run: |
          # Run audit and capture output
          npm audit --json > npm-audit-results.json || true

          # Count critical and high vulnerabilities
          CRITICAL=$(cat npm-audit-results.json | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin'));
            const vulns = d.vulnerabilities || {};
            console.log(Object.values(vulns).filter(v => v.severity === 'critical').length);
          ")
          HIGH=$(cat npm-audit-results.json | node -e "
            const d = JSON.parse(require('fs').readFileSync('/dev/stdin'));
            const vulns = d.vulnerabilities || {};
            console.log(Object.values(vulns).filter(v => v.severity === 'high').length);
          ")

          echo "critical=$CRITICAL" >> $GITHUB_OUTPUT
          echo "high=$HIGH" >> $GITHUB_OUTPUT

          echo "Critical: $CRITICAL, High: $HIGH"

          # Show summary
          npm audit --audit-level=info || true

      - name: Create GitHub Issue for Critical Findings
        if: steps.audit.outputs.critical > 0
        uses: actions/github-script@3a2844b7e9c422d3c10d287c895573f7108da1b3 # v9.0.0
        with:
          script: |
            const critical = '${{ steps.audit.outputs.critical }}';
            const high = '${{ steps.audit.outputs.high }}';

            const runUrl = `${context.serverUrl}/${context.repo.owner}/${context.repo.repo}/actions/runs/${context.runId}`;
            const body = [
              '## Weekly Dependency Audit Found Critical Issues',
              '',
              `**Critical vulnerabilities:** ${critical}`,
              `**High vulnerabilities:** ${high}`,
              '',
              '### Action Required',
              '',
              'Run `npm audit` locally to see the full details and `npm audit fix` where a patch is available.',
              '',
              'For vulnerabilities with no fix available, evaluate alternative packages or apply compensating controls.',
              '',
              `**Run ID:** [${context.runId}](${runUrl})`,
              '',
              '---',
              '*Generated automatically by the weekly dependency check workflow.*',
            ].join('\n');

            await github.rest.issues.create({
              owner: context.repo.owner,
              repo: context.repo.repo,
              title: `Critical security vulnerabilities found: ${new Date().toISOString().split('T')[0]}`,
              body,
              labels: ['security', 'dependencies', 'high-priority'],
            });

      - name: Upload audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: npm-audit-results
          path: npm-audit-results.json
          retention-days: 30

  # ============================================================
  # Python / pip dependency audit
  # ============================================================
  pip-audit:
    name: pip Audit
    runs-on: ubuntu-latest
    needs: detect
    if: needs.detect.outputs.python == 'true'

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: '3.12'

      - name: Install pip-audit
        run: pip install pip-audit

      - name: Run pip-audit
        id: pip_audit
        run: |
          pip-audit -r requirements.txt --format=json --output=pip-audit-results.json || true

          # Check for high severity findings
          HIGH=$(python3 -c "
          import json, sys
          data = json.load(open('pip-audit-results.json'))
          deps = data.get('dependencies', [])
          count = sum(1 for dep in deps
                     for vuln in dep.get('vulns', [])
                     if 'HIGH' in str(vuln.get('aliases', [])).upper() or
                        'CRITICAL' in str(vuln.get('aliases', [])).upper())
          print(count)
          ")

          echo "high_count=$HIGH" >> $GITHUB_OUTPUT
          pip-audit -r requirements.txt || true

      - name: Upload pip-audit results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: pip-audit-results
          path: pip-audit-results.json
          retention-days: 30

  # ============================================================
  # OSV Scanner — comprehensive open source vulnerability check
  # ============================================================
  osv-scan:
    name: OSV Scanner
    runs-on: ubuntu-latest

    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Run OSV Scanner
        uses: google/osv-scanner-action/osv-scanner-action@b1d267aea5211fa648d9d442fa64b90dbdcbdd36 # v2.7.0
        with:
          scan-args: |-
            --recursive
            --output=osv-results.json
            --format=json
            ./

      - name: Upload OSV results
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: osv-scan-results
          path: osv-results.json
          retention-days: 30

  # ============================================================
  # Notify on completion
  # ============================================================
  notify:
    name: Notify
    runs-on: ubuntu-latest
    needs: [npm-audit, pip-audit, osv-scan]
    if: always()

    steps:
      - name: Send Slack notification
        if: env.SLACK_WEBHOOK_URL != ''
        env:
          SLACK_WEBHOOK_URL: ${{ secrets.SLACK_SECURITY_WEBHOOK_URL }}
        run: |
          STATUS="${{ needs.npm-audit.result }}"

          if [ "$STATUS" = "failure" ]; then
            EMOJI="🚨"
            TEXT="Weekly dependency scan found issues — review required"
            COLOR="danger"
          else
            EMOJI="✅"
            TEXT="Weekly dependency scan passed — no critical issues"
            COLOR="good"
          fi

          curl -s -X POST "$SLACK_WEBHOOK_URL" \
            -H "Content-Type: application/json" \
            -d "{
              \"attachments\": [{
                \"color\": \"$COLOR\",
                \"text\": \"$EMOJI $TEXT\",
                \"footer\": \"Weekly Dependency Check | $(date -u +%Y-%m-%d)\"
              }]
            }"
